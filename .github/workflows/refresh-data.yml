name: Refresh data

# Weekly: re-read every source, gate on the full check, and open a pull
# request only when something substantive changed. The pull request IS the
# review step of stage → review → promote (docs/adr/0004): nothing reaches the
# site until a person has read the report and merged it.
on:
  schedule:
    - cron: '17 1 * * 1' # Mondays 09:17 Philippine time
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # For the fallback below: an issue can carry the review when the repository
  # does not let Actions open pull requests.
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-read sources and propose changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each source is independent: one portal being down must not stop the
      # others. Failures are reported in the pull request, never swallowed.
      - name: DILG Full Disclosure Policy Portal (stage, promote)
        id: fdp
        continue-on-error: true
        run: npm run fdp:stage && npm run fdp:promote

      - name: Statements of Receipts and Expenditures (extract, reconcile)
        id: sre
        if: steps.fdp.outcome == 'success'
        continue-on-error: true
        run: npm run fdp:extract

      - name: PSA OpenSTAT census
        id: psa
        continue-on-error: true
        run: npm run psa:fetch

      - name: Internet Archive index of the former municipal website
        id: archive
        continue-on-error: true
        run: npm run archive:index

      - name: Text of newly archived PDFs (for the assistant)
        id: doctext
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        run: npm run documents:text

      - name: DPWH infrastructure projects (via the BetterGov.ph DPWH API)
        id: dpwh
        continue-on-error: true
        run: npm run dpwh:fetch

      - name: DTI Cities and Municipalities Competitiveness Index
        id: cmci
        continue-on-error: true
        run: npm run cmci:fetch

      - name: PSA poverty statistics
        id: poverty
        continue-on-error: true
        run: npm run poverty:fetch

      # The same gate as every pull request: schemas, provenance rules,
      # reconciliation, never-shrink snapshots, and a clean build.
      - name: Full check
        run: npm run check

      - name: Change report
        id: report
        env:
          FDP: ${{ steps.fdp.outcome }}
          SRE: ${{ steps.sre.outcome }}
          PSA: ${{ steps.psa.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          DPWH: ${{ steps.dpwh.outcome }}
          CMCI: ${{ steps.cmci.outcome }}
          POVERTY: ${{ steps.poverty.outcome }}
        run: |
          set -euo pipefail
          node scripts/data-report.mjs --github > "$RUNNER_TEMP/report.md"
          {
            echo
            echo "### Source runs"
            echo
            echo "| Source | Outcome |"
            echo "| --- | --- |"
            echo "| DILG FDP portal | $FDP |"
            echo "| SRE extraction | $SRE |"
            echo "| PSA OpenSTAT | $PSA |"
            echo "| Internet Archive | $ARCHIVE |"
            echo "| DPWH projects | $DPWH |"
            echo "| DTI CMCI | $CMCI |"
            echo "| PSA poverty | $POVERTY |"
          } >> "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the review pull request
        id: pr
        if: steps.report.outputs.substantive == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          branch: data/refresh
          delete-branch: true
          title: 'Data refresh: changes at the sources'
          body-path: ${{ runner.temp }}/report.md
          commit-message: 'Refresh generated datasets from their sources'
          add-paths: |
            src/data/generated
            data/staging
          labels: data

      # The branch is pushed before the pull request is created, so when the
      # repository forbids Actions from opening pull requests the changes are
      # still waiting on data/refresh. Put the report and a one-click link in
      # an issue instead, so the review step still reaches a person.
      - name: Fall back to a review issue
        if: steps.report.outputs.substantive == 'true' && steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin data/refresh >/dev/null
          {
            echo "The weekly refresh found changes, but GitHub did not let the workflow open a pull request"
            echo "(Settings → Actions → General → \"Allow GitHub Actions to create and approve pull requests\")."
            echo
            echo "**Review and merge:** https://github.com/$REPO/compare/main...data/refresh?expand=1"
            echo
            cat "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/issue.md"
          title='Data refresh ready for review'
          number=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/issue.md"
            gh issue comment "$number" --repo "$REPO" --body "Updated by run $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID."
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi

      # A source that fails is reported above and must not pass quietly: the
      # DILG step failed for weeks in October 2026 while every run looked fine.
      # Ending red makes GitHub notify the maintainer.
      - name: Fail if any source failed
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.fdp.outcome }} ${{ steps.sre.outcome }} ${{ steps.psa.outcome }}
            ${{ steps.archive.outcome }} ${{ steps.dpwh.outcome }} ${{ steps.cmci.outcome }}
            ${{ steps.poverty.outcome }}
        run: |
          case " $OUTCOMES " in
            *" failure "*) echo "::error::At least one source failed; see the Source runs table in the summary."; exit 1 ;;
          esac
