name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, civic-data tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The civic-data guardrails: missing sources, future verification dates,
      # unverified records in published tiers, invalid PSGC, and population
      # totals that do not reconcile all fail here.
      - name: Civic data tests
        run: npm run test

      # Validates the generated FDP dataset against its Zod schema: duplicate
      # local or portal ids, invalid year/quarter combinations, unknown form
      # types, missing checksums and schema drift all fail here.
      - name: Validate generated datasets
        run: npm run validate:data

      - name: Build
        run: npm run build

      # The generated dataset is committed. A build must not silently depend on
      # a dataset that differs from what is in the repository.
      - name: Generated dataset is committed and unmodified
        run: git diff --exit-code -- src/data/generated data/staging

      # Belt and braces: assert that values we deliberately withhold never
      # reach the rendered output.
      #
      # This list is values, not topics, and it must be kept in step with
      # src/data/municipality.ts (WITHHELD). Note what is NOT here: the 2024
      # population 60,420 was withheld while PSA was unreachable and is now
      # published at tier 1 from PSA OpenSTAT, so listing it would be wrong.
      - name: Check withheld data did not leak
        run: |
          set -euo pipefail
          fail=0
          check() {
            # $1 = pattern, $2 = why it must not appear
            if grep -rqF -- "$1" dist --include='*.html' --include='*.json' 2>/dev/null; then
              echo "::error::withheld value '$1' appears in built output ($2)"
              fail=1
            fi
          }
          # 2022 municipal contact details, read from an archived document but
          # never republished as current.
          check "(043)"            "2022 archived phone numbers"
          check "mayorsoffice1011" "2022 archived e-mail address"
          check "@gmail.com"       "2022 archived e-mail addresses"
          check "@yahoo.com"       "2022 archived e-mail addresses"
          # Figures superseded by primary sources.
          check "64,234"           "DTI CMCI population; PSA is authoritative"
          check "14,267"           "incorrect household count; PSA reports 15,442"
          exit $fail

      # Elected officials are withheld pending primary confirmation of
      # incumbency. Checked separately because surnames are short strings that
      # could appear incidentally, so we scan rendered prose only.
      - name: Check no unverified officials are named
        run: |
          set -euo pipefail
          fail=0
          for name in Puno Zarraga Palacio Pantoja Ancheta Anzaldo; do
            if grep -rqE "\b$name\b" dist --include='*.html' 2>/dev/null; then
              echo "::error::official '$name' named in output while incumbency is unverified"
              fail=1
            fi
          done
          exit $fail
