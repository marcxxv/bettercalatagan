# Keeps dependencies patched so security advisories do not pile up (28 had
# accumulated by November 2026). Grouped weekly pull requests; CI's
# dependency-audit job fails on any new advisory in between.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    # Major versions need a hand migration (ESLint 10, TypeScript 7 …); they are
    # not proposed automatically. Security updates still arrive regardless.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    # Major versions need a hand migration (ESLint 10, TypeScript 7 …); they are
    # not proposed automatically. Security updates still arrive regardless.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
